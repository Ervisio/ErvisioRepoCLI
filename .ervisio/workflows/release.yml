# Builds eg for every platform and publishes an ErvisioRepo release with the
# archives and checksums.txt, in the layout install.sh and install.ps1 expect.
# Runs on a pushed v* tag, or by hand with the tag to release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1 (created on the current commit when missing)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          set -eu
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag must look like v1.2.3, got $TAG"; exit 1 ;; esac
          version="${TAG#v}"
          ldflags="-s -w -X github.com/Ervisio/ErvisioRepoCLI/internal/build.Version=$version -X github.com/Ervisio/ErvisioRepoCLI/internal/build.Date=$(date -u +%Y-%m-%d)"
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="eg_${version}_${os}_${arch}"
            bin=eg; [ "$os" = windows ] && bin=eg.exe
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/$name/$bin" ./cmd/eg
            cp LICENSE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > checksums.txt)
          cat dist/checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          api="$GITHUB_SERVER_URL/api/v3/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $GH_TOKEN"
          # Release notes: the CHANGELOG section of this version, if any.
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          body=$(python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["GITHUB_SHA"], "name": os.environ["TAG"], "body": open("notes.md").read()}))')
          upload=$(curl -fsS -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/releases" -d "$body" |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          for f in dist/*.tar.gz dist/*.zip dist/checksums.txt; do
            echo "uploading ${f#dist/}"
            curl -fsS -X POST -H "$auth" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$upload?name=${f#dist/}" > /dev/null
          done
          echo "Released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
